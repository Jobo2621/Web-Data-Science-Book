on:
  push:
    branches: [main]
    paths:
      - "**/*.qmd"
      - "tools/make_notebooks.py"
      - ".github/workflows/notebook-regen.yml"
  workflow_dispatch:

name: Notebook regeneration (after merges)

# Pull requests made in GitHub's web editor change a chapter's .qmd but can't
# regenerate its notebook, so after they merge, "Notebook sync" fails on main
# and on every later pull request until someone runs tools/make_notebooks.py.
# That happened for three days in October 2026 (course AAR 2026-10-16, P1-3).
# This job does the step for them: after each push to main it regenerates the
# notebooks and, if anything changed, opens a pull request with the result.
#
# Notes:
# - A pull request opened with the workflow's own token doesn't start other
#   workflows, so its checks won't run until someone pushes to it or closes
#   and reopens it. The change is generated, so that is usually fine to merge.
# - The repository (or organization) setting "Allow GitHub Actions to create
#   and approve pull requests" must be on. If it is off, the last step prints
#   a warning and the regenerated notebooks stay in the run's artifact.

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: notebook-regen
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Regenerate the notebooks
        id: regen
        run: |
          python tools/make_notebooks.py
          if git diff --quiet -- notebooks/; then
            echo "Notebooks are in sync; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat -- notebooks/
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the regenerated notebooks as an artifact
        if: steps.regen.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-notebooks
          path: notebooks/

      - name: Open a pull request with the regenerated notebooks
        if: steps.regen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One open regeneration PR at a time: if one is open, leave it, and
          # the next push to main after it merges will catch anything left.
          open=$(gh pr list --state open --search "in:title Regenerate notebooks after merges" --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "::notice::A regeneration pull request is already open; not opening another."
            exit 0
          fi
          branch="bot/notebook-regen-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add notebooks/
          git commit -m "Regenerate notebooks after merges to main" \
            -m "Generated by .github/workflows/notebook-regen.yml from ${GITHUB_SHA}: python tools/make_notebooks.py."
          git push origin "$branch"
          body=$(printf '%s\n\n%s\n' \
            "Generated by .github/workflows/notebook-regen.yml after ${GITHUB_SHA} reached main: the output of python tools/make_notebooks.py. No .qmd file changes." \
            "Checks don't start on a pull request opened by a workflow's own token; push to this branch, or close and reopen it, to run them.")
          if ! gh pr create --base main --head "$branch" \
                 --title "Regenerate notebooks after merges to main" --body "$body"; then
            echo "::warning::Couldn't open the pull request. Turn on 'Allow GitHub Actions to create and approve pull requests', or open one from branch $branch by hand."
          fi
